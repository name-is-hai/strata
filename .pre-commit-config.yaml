# RPMs and metadata are generated by CI. Commit checks exercise source logic.
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: strata-release-plan
        name: test release input fingerprints and RPM reuse
        entry: node scripts/tests/release-plan.js
        language: system
        pass_filenames: false
        files: ^(\.github/|packaging/|bin/strata-build-rpms|scripts/tests/release-)
      - id: strata-release-base
        name: test verified release download and fallback
        entry: bash scripts/tests/release-base.sh
        language: system
        pass_filenames: false
        files: ^(\.github/|scripts/tests/release-)
      - id: strata-release-version
        name: test independent release and RPM versions
        entry: bash scripts/tests/release-version.sh
        language: system
        pass_filenames: false
        files: ^(bin/strata-(release-version|package-version)|packaging/|scripts/tests/release-version.sh)
      - id: strata-default-browser
        name: test system default browser selection and launch
        entry: bash scripts/tests/default-browser.sh
        language: system
        pass_filenames: false
        files: ^(bin/strata-(launch-browser|default-browser|cmd-default-browser)|scripts/tests/default-browser.sh)
