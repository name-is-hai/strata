general {
    lock_cmd = strata-system-lock
    before_sleep_cmd = strata-system-lock
    # Wake existing outputs without removing lock-screen surfaces.
    after_sleep_cmd = sleep 1 && strata-system-wake
    ignore_dbus_inhibit = false
}

# Strata's idle service controls lock, display-off, and sleep timers from the
# Stay Awake panel. hypridle remains for before/after-sleep hooks.
