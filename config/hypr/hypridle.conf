general {
    lock_cmd = strata-system-lock
    before_sleep_cmd = strata-system-lock
    # Give DRM/virtio outputs a moment to reappear before asking Hyprland to
    # light them. This also restores a keyboard backlight blanked by the lock.
    after_sleep_cmd = sleep 1 && strata-system-wake
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = strata-system-lock
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = strata-system-wake
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
