# Enabled by strata-boot-displays after the Fedora desktop is installed.
# Detect for the target kernel on each build; never require NVIDIA on other
# machines, or fail kernel-install while an optional akmod is still building.
if [[ -f /etc/strata/early-graphics && -x /usr/share/strata/bin/strata-boot-displays && -n ${kernel:-} ]]; then
    _strata_graphics=$(/usr/share/strata/bin/strata-boot-displays --drivers "$kernel") || _strata_graphics=""
    force_drivers+=" ${_strata_graphics//$'\n'/ } "
    unset _strata_graphics
fi
