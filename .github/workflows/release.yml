name: Build Strata release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.1)
        required: true
        type: string
      force_full:
        description: Rebuild every target instead of reusing verified RPMs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: version
        name: Validate version tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(<VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$version" ]]
          bin/strata-release-version --check
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plan:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      has_reuse: ${{ steps.plan.outputs.has_reuse }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download previous verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: bash .github/scripts/download-release-base.sh
      - id: plan
        name: Compare build inputs and verify reusable RPMs
        env:
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: node .github/scripts/release-plan.js plan build-output/reuse-base build-output/release-plan
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-plan
          path: build-output/release-plan/plan.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: steps.plan.outputs.has_reuse == 'true'
        with:
          name: reused-rpms
          path: build-output/release-plan/reused/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    needs: [validate, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [config, desktop, ghostty, uwsm, lock-auth, hyprland, utilities, fonts]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install Podman
        if: fromJSON(needs.plan.outputs.reuse)[matrix.target] != true
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Fedora 44 RPMs
        if: fromJSON(needs.plan.outputs.reuse)[matrix.target] != true
        env:
          TARGET: ${{ matrix.target }}
          STRATA_BUILD_CPUS: '2'
        run: bin/strata-build-rpms "$TARGET"
      - name: Select runtime RPMs
        if: fromJSON(needs.plan.outputs.reuse)[matrix.target] != true
        run: |
          mkdir release-rpms
          find build-output/RPMS -type f -name '*.rpm' \
            ! -name '*-debuginfo-*' ! -name '*-debugsource-*' \
            -exec cp -- {} release-rpms/ \;
      - uses: actions/download-artifact@v8.0.2
        if: fromJSON(needs.plan.outputs.reuse)[matrix.target] == true
        with:
          name: reused-rpms
          path: reused-rpms
      - name: Use unchanged RPMs from previous release
        if: fromJSON(needs.plan.outputs.reuse)[matrix.target] == true
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release-rpms
          cp reused-rpms/"$TARGET"/*.rpm release-rpms/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rpms-${{ matrix.target }}
          path: release-rpms/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    needs: [validate, plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rpms-*
          path: incoming
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-plan
          path: build-output/release-plan
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Assemble and verify repository
        run: |
          podman run --rm --user 0 -v "$PWD:/repo:Z" -w /repo \
            registry.fedoraproject.org/fedora:44 bash -euc '
              dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-build
              bash .github/scripts/assemble-release.sh incoming
            '
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record build inputs and package checksums for future reuse
        run: |
          node .github/scripts/release-plan.js record build-output/release-plan/plan.json \
            incoming build-output/release/assets
      - name: Resolve fresh Fedora dependencies
        run: |
          podman run --rm --user 0 -v "$PWD:/repo:ro,Z" -w /repo \
            registry.fedoraproject.org/fedora:44 bash -euc '
              dnf install -y --setopt=install_weak_deps=False dnf-plugins-core curl-minimal
              repo_ready=0
              for base in https://download1.rpmfusion.org https://mirrors.rpmfusion.org; do
                if dnf install -y --setopt=install_weak_deps=False \
                    "$base/free/fedora/rpmfusion-free-release-44.noarch.rpm"; then
                  repo_ready=1
                  break
                fi
              done
              if (( repo_ready == 0 )); then
                echo "RPM Fusion repository setup failed from all endpoints." >&2
                exit 1
              fi
              # Avoid the COPR API dependency; retain the official signing key.
              curl --fail --location --silent --show-error \
                --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 \
                https://copr.fedorainfracloud.org/coprs/errornointernet/quickshell/repo/fedora-44/errornointernet-quickshell-fedora-44.repo \
                --output /tmp/quickshell.repo
              install -m 0644 /tmp/quickshell.repo \
                /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:errornointernet:quickshell.repo
              result=0
              dnf --assumeno --setopt=install_weak_deps=False \
                --repofrompath=strata-release,file:///repo --enablerepo=strata-release \
                --setopt=strata-release.gpgcheck=0 install hyprland-desktop strata-config \
                > /tmp/transaction.log 2>&1 || result=$?
              cat /tmp/transaction.log
              if ! grep -Fq "Transaction Summary" /tmp/transaction.log; then
                echo "Dependency resolution failed (DNF exit $result)." >&2
                exit 1
              fi
            '
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: build-output/release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" assets/* --verify-tag --draft \
            --title "Strata $TAG" --notes-file .github/release-notes.md
